<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bertahan Semalaman</title>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120e19;--pan:#1d1629;--ln:#4a3560;--acc:#c0334d;--gold:#f0c24b;--tx:#efe8f5;--gem:#4fc3ff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:500 14px 'Chakra Petch',system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#ui{position:fixed;inset:0;display:grid;place-items:center;background:#0a0710cc;overflow:auto;padding:12px}
.card{width:min(460px,100%);background:var(--pan);border:1px solid var(--ln);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
h1{margin:0;font:400 46px/1 'Pirata One',serif;color:var(--acc)}h2{margin:0;font:400 30px 'Pirata One',serif}
p{margin:0;line-height:1.45;opacity:.88}small{opacity:.6;line-height:1.4}
button{font:700 15px inherit;font-family:inherit;color:var(--tx);background:#2b2040;border:1px solid var(--ln);border-radius:10px;padding:12px;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);font-size:17px}button[disabled]{opacity:.4}
.opt{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px}.opt b{font-size:16px;color:var(--gold)}.opt span{opacity:.8;font-weight:500}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#251a35;border-radius:10px;padding:8px 10px}
.row button{min-width:84px;padding:8px}.pips{color:var(--gold);letter-spacing:2px}
#pz{position:fixed;top:calc(30px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));width:42px;height:38px;padding:0;font-size:16px}
#toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);font:400 clamp(26px,7vmin,52px) 'Pirata One',serif;color:var(--acc);text-shadow:0 2px 14px #000;opacity:0;pointer-events:none;white-space:nowrap}
#toast.s{animation:t 2s ease-out}@keyframes t{0%{opacity:1;transform:translate(-50%,0) scale(1.2)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}
</style></head><body>
<canvas id="c"></canvas><button id="pz">II</button><div id="toast"></div><div id="ui"></div>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d'),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
let S={coins:0,m:{hp:0,dmg:0,spd:0},best:0};
try{Object.assign(S,JSON.parse(localStorage.getItem('survivor9')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('survivor9',JSON.stringify(S))}catch(e){}};
const WD={knife:['Pisau Lempar','Menembak musuh terdekat'],orbit:['Bilah Berputar','Bilah mengelilingimu'],aura:['Aura Api','Membakar musuh di sekitar'],bolt:['Petir','Menyambar musuh acak'],axe:['Kapak Besar','Kapak melambung menembus musuh']};
const PD={pow:['Kekuatan','+15% damage'],spd:['Kecepatan','+10% gerak'],mag:['Magnet','+35% jangkauan XP'],hp:['Vitalitas','+25 HP maks'],cdr:['Pemulihan','Senjata 8% lebih cepat'],reg:['Regenerasi','+0.6 HP per detik']};
const MU=[['hp','Darah Tebal','+15 HP awal'],['dmg','Tenaga Gelap','+6% damage'],['spd','Kaki Ringan','+4% kecepatan']];
const ET={bat:{r:9,hp:6,spd:100,dmg:6,col:'#b06cff',xp:1},zom:{r:13,hp:24,spd:55,dmg:9,col:'#5fa86b',xp:2},wra:{r:11,hp:32,spd:112,dmg:11,col:'#6fd3e0',xp:3},bru:{r:21,hp:110,spd:42,dmg:16,col:'#c0562d',xp:7}};
let W,H,sc,VW,VH,st='menu',pl,E,PR,GM,TX,FX,time,kills,acc,pend,bosses,shake,ang,K,res;
const keys={},J={on:0,ox:0,oy:0,x:0,y:0};
function resize(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d|0;cv.height=innerHeight*d|0;W=cv.width;H=cv.height;sc=d*cl(Math.min(innerWidth,innerHeight)/480,.7,1.3);VW=W/sc;VH=H/sc}
addEventListener('resize',resize);
const ui=$('#ui'),show=h=>{ui.innerHTML=h;ui.style.display=h?'grid':'none'};
function toast(m){const e=$('#toast');e.textContent=m;e.classList.remove('s');void e.offsetWidth;e.classList.add('s')}
/* ---------- menus ---------- */
const mcost=k=>Math.round(80*Math.pow(S.m[k]+1,1.5)/10)*10;
function menu(){st='menu';$('#pz').style.display='none';show(`<div class=card><h1>Bertahan<br>Semalaman</h1><p>Lawan gelombang monster, kumpulkan XP, pilih senjata baru, dan bertahan selama 10 menit. Senjata menyerang otomatis, kamu hanya perlu bergerak.</p><p>Koin <b style="color:var(--gold)">${S.coins}</b>. Waktu terlama ${fmt(S.best)}.</p><button class=pri data-a=play>MULAI</button><button data-a=shop>TOKO UPGRADE</button><small>Gerak: WASD atau panah. Di layar sentuh, seret jari di mana saja. P untuk jeda.</small></div>`)}
function shop(){show(`<div class=card><h2>Toko Upgrade</h2><p>Koin <b style="color:var(--gold)">${S.coins}</b></p>${MU.map(([k,n,d])=>{const l=S.m[k],mx=l>=5;return `<div class=row><div><b>${n}</b> <span class=pips>${'●'.repeat(l)+'○'.repeat(5-l)}</span><br><small>${d}</small></div><button data-b=${k} ${mx||S.coins<mcost(k)?'disabled':''}>${mx?'MAKS':mcost(k)}</button></div>`}).join('')}<button data-a=menu>KEMBALI</button></div>`)}
ui.addEventListener('click',e=>{const t=e.target.closest('[data-a],[data-b],[data-o]');if(!t)return;const d=t.dataset;
if(d.b){S.coins-=mcost(d.b);S.m[d.b]++;save();shop()}else if(d.o){pick(d.o)}else if(d.a=='play')play();else if(d.a=='menu')menu();else if(d.a=='shop')shop();else if(d.a=='resume'){show('');st='play'}});
$('#pz').onclick=pause;function pause(){if(st=='play'){st='pause';show(`<div class=card><h2>Jeda</h2><button class=pri data-a=resume>LANJUT</button><button data-a=menu>KELUAR KE MENU</button></div>`)}else if(st=='pause'){show('');st='play'}}
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
/* ---------- game ---------- */
function play(){pl={x:0,y:0,hp:100+15*S.m.hp,xp:0,lv:1,need:6,inv:0,fx:1,fy:0,w:{knife:1},wt:{},p:{}};E=[];PR=[];GM=[];TX=[];FX=[];time=0;kills=0;acc=0;pend=0;bosses=[180,360,540];shake=0;ang=0;stats();pl.hp=K.max;st='play';show('');$('#pz').style.display='block';toast('Malam dimulai')}
function stats(){const p=pl.p;K={pow:(1+.06*S.m.dmg)*(1+.15*(p.pow||0)),spd:140*(1+.04*S.m.spd)*(1+.1*(p.spd||0)),mag:70*(1+.35*(p.mag||0)),max:100+15*S.m.hp+25*(p.hp||0),cdm:Math.pow(.92,p.cdr||0),reg:.6*(p.reg||0)}}
function spawn(boss){const a=rnd(0,6.283),R=Math.hypot(VW,VH)/2+40;let t;
 if(boss)t={...ET.bru,r:38,hp:900,spd:52,dmg:26,xp:70,boss:1,col:'#9a1f3a'};
 else{const r=Math.random(),tm=time;let k='bat';if(tm>240&&r<.2)k='wra';else if(tm>150&&r<.3)k='bru';else if(tm>60&&r<.6)k='zom';t={...ET[k]}}
 t.hp*=1+time/100*(boss?.6:1);t.mhp=t.hp;t.x=pl.x+Math.cos(a)*R;t.y=pl.y+Math.sin(a)*R;t.fl=0;t.ot=0;t.at=0;E.push(t)}
function hit(e,d){if(e.dead)return;d*=K.pow;e.hp-=d;e.fl=.08;if(TX.length<40)TX.push({x:e.x+rnd(-8,8),y:e.y-e.r,v:Math.round(d),t:.5});
 if(e.hp<=0){e.dead=1;kills++;if(e.boss){for(let i=0;i<8;i++)GM.push({x:e.x+rnd(-40,40),y:e.y+rnd(-40,40),v:e.xp/8});pl.hp=K.max;toast('BOS TUMBANG')}else GM.push({x:e.x,y:e.y,v:e.xp})}}
const near=(x,y,m)=>{let b=null,bd=m*m;for(const e of E){if(e.dead)continue;const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;b=e}}return b};
function upd(dt){
 time+=dt;stats();ang+=dt;shake=Math.max(0,shake-dt*3);pl.inv-=dt;
 let mx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0)+J.x,my=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0)+J.y;const m=Math.hypot(mx,my);
 if(m>0){if(m>1){mx/=m;my/=m}pl.x+=mx*K.spd*dt;pl.y+=my*K.spd*dt;const n=Math.hypot(mx,my);pl.fx=mx/n;pl.fy=my/n}
 pl.hp=Math.min(K.max,pl.hp+K.reg*dt);
 acc+=dt;const iv=Math.max(.14,.85-time/800),cnt=1+Math.floor(time/150);while(acc>iv){acc-=iv;if(E.length<380)for(let i=0;i<cnt;i++)spawn()}
 if(bosses.length&&time>=bosses[0]){bosses.shift();spawn(1);toast('BOS MUNCUL')}
 /* weapons */
 const w=pl.w,wt=pl.wt;for(const k in w){const l=w[k];wt[k]=(wt[k]||0)-dt;
  if(k=='knife'&&wt[k]<=0){const t=near(pl.x,pl.y,420);wt[k]=.85*K.cdm;if(t){const n=1+(l>=3)+(l>=5),b=Math.atan2(t.y-pl.y,t.x-pl.x);for(let i=0;i<n;i++){const a=b+(i-(n-1)/2)*.2;PR.push({x:pl.x,y:pl.y,vx:Math.cos(a)*540,vy:Math.sin(a)*540,dmg:10+4*l,life:1.1,pr:1+(l>=4)*2,r:7,ty:'k',h:[]})}}}
  if(k=='orbit'){const n=Math.min(6,l+1);for(let i=0;i<n;i++){const a=ang*(3+.4*l)+i*6.283/n,bx=pl.x+Math.cos(a)*72,by=pl.y+Math.sin(a)*72;for(const e of E)if(!e.dead&&e.ot<=0&&(e.x-bx)**2+(e.y-by)**2<(e.r+10)**2){hit(e,8+3*l);e.ot=.35}}}
  if(k=='aura'&&wt[k]<=0){wt[k]=.5*K.cdm;const R=58+13*l;FX.push({ty:'a',x:pl.x,y:pl.y,r:R,t:.25});for(const e of E)if(!e.dead&&(e.x-pl.x)**2+(e.y-pl.y)**2<(R+e.r)**2){hit(e,5+3*l);const d=Math.hypot(e.x-pl.x,e.y-pl.y)||1;e.x+=(e.x-pl.x)/d*6;e.y+=(e.y-pl.y)/d*6}}
  if(k=='bolt'&&wt[k]<=0){wt[k]=(2.1-.2*l)*K.cdm;const c=E.filter(e=>!e.dead&&Math.abs(e.x-pl.x)<VW/2&&Math.abs(e.y-pl.y)<VH/2);for(let i=0;i<1+(l>>1)&&c.length;i++){const t=c.splice(Math.random()*c.length|0,1)[0];FX.push({ty:'b',x:t.x,y:t.y,t:.3});shake=Math.max(shake,.15);for(const e of E)if(!e.dead&&(e.x-t.x)**2+(e.y-t.y)**2<(48+e.r)**2)hit(e,25+9*l)}}
  if(k=='axe'&&wt[k]<=0){wt[k]=1.6*K.cdm;PR.push({x:pl.x,y:pl.y,vx:rnd(-130,130),vy:-400,g:800,dmg:20+7*l,life:2.4,pr:999,r:18+2*l,ty:'a',h:[]})}}
 /* projectiles */
 for(const p of PR){p.life-=dt;if(p.g)p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  for(const e of E)if(!e.dead&&(e.x-p.x)**2+(e.y-p.y)**2<(e.r+p.r)**2){if(p.ty=='k'){if(p.h.includes(e))continue;p.h.push(e);hit(e,p.dmg);if(--p.pr<0){p.life=0;break}}else if(e.at<=0){hit(e,p.dmg);e.at=.3}}}
 PR=PR.filter(p=>p.life>0);
 /* enemies */
 for(const e of E){if(e.dead)continue;e.fl-=dt;e.ot-=dt;e.at-=dt;const dx=pl.x-e.x,dy=pl.y-e.y,d=Math.hypot(dx,dy)||1;
  if(d>Math.hypot(VW,VH)){const a=rnd(0,6.283),R=Math.hypot(VW,VH)/2+30;e.x=pl.x+Math.cos(a)*R;e.y=pl.y+Math.sin(a)*R;continue}
  e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;
  if(d<e.r+10&&pl.inv<=0){pl.hp-=e.dmg;pl.inv=.5;shake=.5}}
 E=E.filter(e=>!e.dead);
 /* gems */
 for(const q of GM){const dx=pl.x-q.x,dy=pl.y-q.y,d=Math.hypot(dx,dy)||1;if(d<K.mag||q.f){q.f=1;q.x+=dx/d*420*dt;q.y+=dy/d*420*dt}if(d<14){q.dead=1;pl.xp+=q.v}}
 GM=GM.filter(q=>!q.dead);
 while(pl.xp>=pl.need){pl.xp-=pl.need;pl.lv++;pl.need=Math.floor(4+pl.lv*5+pl.lv*pl.lv*.6);pend++}
 for(const t of TX){t.t-=dt;t.y-=30*dt}TX=TX.filter(t=>t.t>0);for(const f of FX)f.t-=dt;FX=FX.filter(f=>f.t>0);
 if(pend>0)levelUp();
 if(pl.hp<=0)over(0);else if(time>=600)over(1)}
function levelUp(){st='lvl';const pool=[];for(const k in WD)if((pl.w[k]||0)<5)pool.push('w:'+k);for(const k in PD)if((pl.p[k]||0)<5)pool.push('p:'+k);
 const o=[];while(o.length<3&&pool.length)o.push(pool.splice(Math.random()*pool.length|0,1)[0]);
 if(!o.length){pl.hp=K.max;pend=0;st='play';return}
 show(`<div class=card><h2>Naik Level ${pl.lv}</h2>${o.map(x=>{const [t,k]=x.split(':'),d=t=='w'?WD[k]:PD[k],l=(t=='w'?pl.w[k]:pl.p[k])||0;return `<button class=opt data-o=${x}><b>${d[0]} ${l?'Lv '+l+' ke '+(l+1):'(baru)'}</b><span>${d[1]}</span></button>`}).join('')}</div>`)}
function pick(x){const [t,k]=x.split(':');if(t=='w')pl.w[k]=(pl.w[k]||0)+1;else{pl.p[k]=(pl.p[k]||0)+1;if(k=='hp'){stats();pl.hp+=25}}pend--;show('');st='play';if(pend>0)levelUp()}
function over(win){st='over';$('#pz').style.display='none';const c=Math.floor(kills/4+time/6)*(win?2:1);S.coins+=c;S.best=Math.max(S.best,time);save();
 show(`<div class=card><h2 style="color:${win?'var(--gold)':'var(--acc)'}">${win?'KAMU BERTAHAN SAMPAI PAGI!':'KAMU TUMBANG'}</h2><p>Waktu ${fmt(time)}<br>Level ${pl.lv}<br>Musuh dikalahkan ${kills}<br><b style="color:var(--gold)">+${c} koin</b></p><button class=pri data-a=play>MAIN LAGI</button><button data-a=shop>TOKO UPGRADE</button><button data-a=menu>MENU</button></div>`)}
/* ---------- input ---------- */
addEventListener('keydown',e=>{const k=e.key.length>1?e.key:e.key.toLowerCase();keys[k]=1;if(k=='p'||k=='Escape')pause();if(k.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key.length>1?e.key:e.key.toLowerCase()]=0});
cv.addEventListener('pointerdown',e=>{J.on=e.pointerId;J.ox=J.sx=e.clientX;J.oy=J.sy=e.clientY;J.x=J.y=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(J.on!=e.pointerId)return;const dx=e.clientX-J.ox,dy=e.clientY-J.oy,d=Math.hypot(dx,dy),mx=50;if(d>mx){J.ox+=dx/d*(d-mx);J.oy+=dy/d*(d-mx)}J.x=cl((e.clientX-J.ox)/mx,-1,1);J.y=cl((e.clientY-J.oy)/mx,-1,1);J.cx=e.clientX;J.cy=e.clientY});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,e=>{if(J.on==e.pointerId){J.on=0;J.x=J.y=0}}));
/* ---------- draw ---------- */
function draw(){
 g.setTransform(1,0,0,1,0,0);g.fillStyle='#120e19';g.fillRect(0,0,W,H);
 const cx=pl?pl.x:0,cy=pl?pl.y:0,sk=shake*6;g.setTransform(sc,0,0,sc,W/2-cx*sc+rnd(-sk,sk)*sc,H/2-cy*sc+rnd(-sk,sk)*sc);
 const x0=Math.floor((cx-VW/2)/64)-1,y0=Math.floor((cy-VH/2)/64)-1;
 for(let i=x0;i<x0+VW/64+3;i++)for(let j=y0;j<y0+VH/64+3;j++){const h=(i*73856093^j*19349663)>>>0;g.fillStyle=(i+j)&1?'#161120':'#181223';g.fillRect(i*64,j*64,64,64);
  if(h%5==0){g.fillStyle='#2a2038';g.beginPath();g.arc(i*64+h%53+5,j*64+(h>>3)%53+5,2+h%3,0,7);g.fill()}if(h%17==0){g.fillStyle='#231a31';g.fillRect(i*64+20,j*64+16,6,16);g.fillRect(i*64+14,j*64+21,18,5)}}
 if(!pl)return;
 for(const f of FX)if(f.ty=='a'){g.fillStyle=`rgba(255,110,40,${f.t*1.2})`;g.beginPath();g.arc(f.x,f.y,f.r,0,7);g.fill()}
 else{g.strokeStyle=`rgba(190,230,255,${f.t*3})`;g.lineWidth=4;g.beginPath();let y=f.y-VH/2,x=f.x;g.moveTo(x,y);while(y<f.y){y+=30;x=f.x+rnd(-16,16);g.lineTo(x,y)}g.lineTo(f.x,f.y);g.stroke();g.fillStyle=`rgba(190,230,255,${f.t*2})`;g.beginPath();g.arc(f.x,f.y,48,0,7);g.fill()}
 if(pl.w.aura){g.strokeStyle='rgba(255,120,50,.35)';g.lineWidth=2;g.beginPath();g.arc(pl.x,pl.y,58+13*pl.w.aura,0,7);g.stroke()}
 for(const q of GM){g.fillStyle=q.v>=3?'#ffd45a':'#4fc3ff';g.beginPath();g.moveTo(q.x,q.y-6);g.lineTo(q.x+5,q.y);g.lineTo(q.x,q.y+6);g.lineTo(q.x-5,q.y);g.fill()}
 for(const e of E){g.fillStyle=e.fl>0?'#fff':e.col;g.beginPath();g.arc(e.x,e.y,e.r,0,7);g.fill();
  const a=Math.atan2(pl.y-e.y,pl.x-e.x),ex=Math.cos(a)*e.r*.35,ey=Math.sin(a)*e.r*.35;g.fillStyle=e.boss?'#ffd45a':'#1a1020';g.beginPath();g.arc(e.x+ex-e.r*.28,e.y+ey-e.r*.15,e.r*.14,0,7);g.arc(e.x+ex+e.r*.28,e.y+ey-e.r*.15,e.r*.14,0,7);g.fill();
  if(e.boss){g.strokeStyle='#ff4a6a';g.lineWidth=3;g.beginPath();g.arc(e.x,e.y,e.r+3,0,7);g.stroke();g.fillStyle='#000';g.fillRect(e.x-30,e.y-e.r-12,60,6);g.fillStyle='#ff4a6a';g.fillRect(e.x-30,e.y-e.r-12,60*e.hp/e.mhp,6)}}
 if(pl.w.orbit){const n=Math.min(6,pl.w.orbit+1);for(let i=0;i<n;i++){const a=ang*(3+.4*pl.w.orbit)+i*6.283/n;g.save();g.translate(pl.x+Math.cos(a)*72,pl.y+Math.sin(a)*72);g.rotate(a*3);g.fillStyle='#cfd8ff';g.fillRect(-4,-12,8,24);g.restore()}}
 for(const p of PR){if(p.ty=='k'){g.save();g.translate(p.x,p.y);g.rotate(Math.atan2(p.vy,p.vx));g.fillStyle='#eef';g.beginPath();g.moveTo(10,0);g.lineTo(-8,-4);g.lineTo(-8,4);g.fill();g.restore()}else{g.save();g.translate(p.x,p.y);g.rotate(time*9);g.fillStyle='#b9c0d4';g.beginPath();g.arc(0,0,p.r,0,7);g.fill();g.fillStyle='#6a5a7a';g.fillRect(-p.r*.2,-p.r,p.r*.4,p.r*2);g.restore()}}
 if(pl.inv<=0||Math.floor(pl.inv*20)%2){g.fillStyle='#7a1f33';g.beginPath();g.arc(pl.x-pl.fx*5,pl.y-pl.fy*5,13,0,7);g.fill();g.fillStyle='#efe6d2';g.beginPath();g.arc(pl.x,pl.y,11,0,7);g.fill();g.fillStyle='#1a1020';g.beginPath();g.arc(pl.x+pl.fx*4-3,pl.y+pl.fy*3-2,1.8,0,7);g.arc(pl.x+pl.fx*4+3,pl.y+pl.fy*3-2,1.8,0,7);g.fill()}
 g.fillStyle='#000a';g.fillRect(pl.x-16,pl.y+16,32,5);g.fillStyle='#e0384f';g.fillRect(pl.x-16,pl.y+16,32*cl(pl.hp/K.max,0,1),5);
 g.font='700 13px Chakra Petch,sans-serif';g.textAlign='center';for(const t of TX){g.fillStyle=`rgba(255,235,150,${t.t*2})`;g.fillText(t.v,t.x,t.y)}
 /* HUD */
